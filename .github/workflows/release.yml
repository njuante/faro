name: Release

# A tag like v0.1.0 publishes the GitHub release (notes from CHANGELOG.md) and
# the Docker image ghcr.io/njuante/faro:<version> and :latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches faro/__init__.py
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "__version__ = '$version'" faro/__init__.py || {
            echo "faro/__init__.py does not say $version"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "faro $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker image
        run: |
          version="${GITHUB_REF_NAME#v}"
          image=ghcr.io/${{ github.repository_owner }}/faro
          docker build -t "$image:$version" -t "$image:latest" .
          docker run -d --name smoke -p 8080:8080 "$image:$version" demo --bind 0.0.0.0
          for i in $(seq 1 20); do curl -fs localhost:8080/api/me && break; sleep 1; done
          curl -fs localhost:8080/api/me
          docker push "$image:$version"
          docker push "$image:latest"
